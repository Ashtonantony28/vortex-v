name: CI

# CI gates (both must pass):
#   1. tests  - ISA/model/assembler pytest + cocotb RTL simulation under Icarus,
#               including the RTL<->ISS lockstep co-sim and the riscv-tests
#               RV64I/RV64M conformance suite (on both the ISS and the RTL).
#   2. lint   - verilator --lint-only -Wall over rtl/core/files.f, for both
#               tops (vortex_core, and vortex_ooo_core at WIDTH 1 and 2, and
#               two-wide with SPEC_BRANCHES=1, plus LSQ=1, plus XM_LATENCY=3), the
#               SoC (vortex_soc) and the Arty A7 top (arty_a7_top).
#   The tests job also runs the yosys SAT proof of the LSQ forwarding unit
#   (verif/formal, ADR 0009).

# Push runs the suite only on main + tags; every other branch is covered by its
# pull_request run, so feature branches are tested once, not twice.
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  tests:
    name: pytest + cocotb RTL sim (gate)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install simulator (Icarus Verilog), yosys and RISC-V cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog yosys gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy "cocotb==2.1.0"

      - name: Run tests
        run: pytest isa/ model/ asm/ verif/ -q

  lint:
    name: Verilator lint (gate)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq verilator

      - name: Lint RTL
        run: |
          verilator --lint-only -Wall --top-module vortex_core -f rtl/core/files.f
          verilator --lint-only -Wall --top-module vortex_ooo_core -f rtl/core/files.f
          verilator --lint-only -Wall --top-module vortex_ooo_core -GWIDTH=2 -f rtl/core/files.f
          verilator --lint-only -Wall --top-module vortex_ooo_core -GWIDTH=2 -GSPEC_BRANCHES=1 -f rtl/core/files.f
          verilator --lint-only -Wall --top-module vortex_ooo_core -GWIDTH=2 -GSPEC_BRANCHES=1 -GLSQ=1 -f rtl/core/files.f
          verilator --lint-only -Wall --top-module vortex_ooo_core -GWIDTH=2 -GSPEC_BRANCHES=1 -GLSQ=1 -GXM_LATENCY=3 -f rtl/core/files.f
          verilator --lint-only -Wall --top-module vortex_soc -GCORE_OOO=0 -f rtl/core/files.f -f rtl/soc/files.f
          verilator --lint-only -Wall --top-module vortex_soc -f rtl/core/files.f -f rtl/soc/files.f
          verilator --lint-only -Wall --top-module vortex_ooo_core -GWIDTH=2 -GSPEC_BRANCHES=1 -GLSQ=1 -GXM_LATENCY=3 -GSYNC_MEM=1 -f rtl/core/files.f
          verilator --lint-only -Wall --top-module vortex_ooo_core -GWIDTH=2 -GXM_PORTS=2 -f rtl/core/files.f
          verilator --lint-only -Wall --top-module vortex_ooo_core -GWIDTH=2 -GSPEC_BRANCHES=1 -GLSQ=1 -GXM_LATENCY=3 -GSYNC_MEM=1 -GXM_PORTS=2 -f rtl/core/files.f
          verilator --lint-only -Wall --top-module vortex_soc -GSYNC_MEM=1 -f rtl/core/files.f -f rtl/soc/files.f
          verilator --lint-only -Wall --top-module arty_a7_top -f rtl/core/files.f -f rtl/soc/files.f -f rtl/fpga/files.f
